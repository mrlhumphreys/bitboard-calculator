<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Bitboard Calculator</title>
    <link rel="stylesheet" href="./stylesheets/application.css" type="text/css" media="screen" title="application stylesheet" charset="utf-8">
    <script src="./javascripts/application.js" charset="utf-8"></script>
  </head>
  <body>
    <article class="main">
      <h1>Bitboard Calculator</h1>
      <form id="board_dimensions" class="board_dimensions">
        <label for="board_width">Width:</label>
        <input type="number" value="8" min="1" max="20" name="board_width" id="board_width" class="board_dimension" />
        <label for="board_height">Height:</label>
        <input type="number" value="8" min="1" max="20" name="board_height" id="board_height" class="board_dimension" />
        <input type="submit" value="Resize" name="board_dimension_submit" id="board_dimension_submit" class="board_dimension_submit" />
      </form>

      <template id="cell">
        <div class="cell" data-value="0"></div>
      </template>

      <template id="row">
        <div class="row">
        </div>
      </template>
